# LeadFlowX QA Workflow
# Updated to use centralized configuration and templates

version: '3.8'

services:
  leadflowx-qa-workflow:
    build: .
    <<: *default-restart
    <<: *default-logging
    networks: *default-networks
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DB_URL=${DB_URL}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:29092}
      - KAFKA_VERIFIED_TOPIC=${KAFKA_VERIFIED_TOPIC:-lead.verified}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-verifier-group}
    ports:
      - "${QA_WORKFLOW_PORT:-8083}:${QA_WORKFLOW_INTERNAL_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${QA_WORKFLOW_INTERNAL_PORT:-8080}/health"]
      <<: *healthcheck-base

networks:
  leadflowx-network:
    external: true
